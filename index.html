<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
   
    <meta name="google-adsense-account" content="ca-pub-4026443598393506">
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />


    <script>
      (function() {
        try {
          var win = window;
          var prop = 'fetch';
          if (typeof win[prop] === 'undefined') return;
          
          var desc = Object.getOwnPropertyDescriptor(win, prop) || 
                     Object.getOwnPropertyDescriptor(Object.getPrototypeOf(win), prop);
          
          if (desc && !desc.configurable) return;

          var originalFetch = win[prop];
          Object.defineProperty(win, prop, {
            get: function() { return originalFetch; },
            set: function(v) { originalFetch = v; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Silent fail
        }
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
