<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Merge, compress, split, convert and edit PDF files online for free." />
    <title>My Loves PDF - Free Online PDF Tools</title>
    
    <!-- FOUC & White Flash Prevention Styles -->
    <style id="theme-flash-prevention">
      html, body {
        background-color: #f8fafc; /* bg-slate-50 */
        margin: 0;
        padding: 0;
      }
      @media (prefers-color-scheme: dark) {
        html, body {
          background-color: #0f172a; /* bg-slate-900 */
        }
      }
      /* Hide pre-rendered SEO content immediately on JavaScript-enabled environments to prevent flickering */
      html.js #prerender-seo-wrapper {
        display: none !important;
      }
    </style>
    
    <!-- Blocking Script to Tag JS-Enabled Environments Instantly -->
    <script id="js-tester">
      document.documentElement.classList.add('js');
    </script>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4026443598393506"
      crossorigin="anonymous"></script>
    <script>
      (function() {
        try {
          var win = window;
          var prop = 'fetch';
          if (typeof win[prop] === 'undefined') return;
          
          var desc = Object.getOwnPropertyDescriptor(win, prop) || 
                     Object.getOwnPropertyDescriptor(Object.getPrototypeOf(win), prop);
          
          if (desc && !desc.configurable) return;

          var originalFetch = win[prop];
          Object.defineProperty(win, prop, {
            get: function() { return originalFetch; },
            set: function(v) { originalFetch = v; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Silent fail
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
